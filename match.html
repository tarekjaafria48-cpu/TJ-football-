<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TJ Football - تفاصيل المباراة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--red:#ff1744;
--blue:#1677ff;
--dark:#030812;
--card:#0a1424;
--card2:#0d1b2e;
--text:#f7f9fc;
--muted:#91a4ba;
--border:#1b3049;
}

body{

font-family:Arial,Tahoma,sans-serif;

background:
radial-gradient(circle at 10% 0%,#102c55 0,transparent 32%),
radial-gradient(circle at 90% 10%,#3b0712 0,transparent 30%),
var(--dark);

color:var(--text);

min-height:100vh;

}

header{

background:rgba(3,8,18,.94);

border-bottom:1px solid var(--border);

padding:15px;

position:sticky;

top:0;

z-index:10;

}

.header{

max-width:1000px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

}

.logo{

font-size:24px;

font-weight:1000;

font-style:italic;

}

.logo span{

color:var(--red);

}

.back{

text-decoration:none;

color:white;

background:#ffffff0b;

border:1px solid #ffffff18;

padding:9px 14px;

border-radius:10px;

font-size:12px;

}

.container{

width:92%;

max-width:900px;

margin:25px auto;

}

.competition{

text-align:center;

color:var(--muted);

font-size:13px;

margin-bottom:8px;

}

.status{

text-align:center;

margin-bottom:18px;

}

.status span{

display:inline-block;

padding:7px 16px;

border-radius:20px;

font-size:12px;

font-weight:bold;

background:#173252;

color:#8fc5ff;

}

.status.live span{

background:#3a0b16;

color:#ff496d;

box-shadow:0 0 20px #ff174425;

}

.score-card{

background:

linear-gradient(
145deg,
rgba(13,30,53,.98),
rgba(6,15,28,.98)
);

border:1px solid var(--border);

border-radius:25px;

padding:30px 20px;

box-shadow:0 25px 70px #0008;

}

.teams{

display:flex;

align-items:center;

justify-content:center;

gap:35px;

}

.team{

width:35%;

text-align:center;

}

.team-logo{

width:90px;

height:90px;

object-fit:contain;

margin-bottom:12px;

}

.team-name{

font-size:19px;

font-weight:900;

line-height:1.4;

}

.center{

text-align:center;

min-width:120px;

}

.score{

font-size:52px;

font-weight:1000;

color:white;

}

.vs{

font-size:13px;

color:var(--muted);

margin-top:5px;

}

.info{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

margin-top:28px;

}

.info-box{

background:#ffffff06;

border:1px solid #ffffff0a;

border-radius:13px;

padding:14px;

text-align:center;

}

.info-title{

font-size:11px;

color:var(--muted);

margin-bottom:6px;

}

.info-value{

font-size:13px;

font-weight:bold;

}

.section{

margin-top:20px;

background:

linear-gradient(
145deg,
rgba(10,20,36,.96),
rgba(5,13,24,.96)
);

border:1px solid var(--border);

border-radius:20px;

padding:20px;

}

.section h2{

font-size:19px;

margin-bottom:15px;

border-right:4px solid var(--red);

padding-right:10px;

}

.event{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

padding:13px 5px;

border-bottom:1px solid #17283c;

font-size:13px;

}

.event:last-child{

border-bottom:0;

}

.minute{

color:#55aaff;

font-weight:bold;

}

.stat{

margin-bottom:17px;

}

.stat-head{

display:flex;

justify-content:space-between;

font-size:12px;

margin-bottom:7px;

}

.bar{

height:8px;

background:#14263b;

border-radius:20px;

overflow:hidden;

}

.bar-home{

height:100%;

background:var(--blue);

border-radius:20px;

}

.bar-away{

height:100%;

background:var(--red);

border-radius:20px;

}

.loading{

text-align:center;

padding:45px 10px;

color:var(--muted);

}

.error{

text-align:center;

padding:30px;

background:#3a0b16;

border-radius:15px;

color:#ff8197;

}

footer{

text-align:center;

padding:30px;

margin-top:30px;

background:#020711;

border-top:1px solid var(--border);

color:#667c94;

font-size:11px;

}

@media(max-width:650px){

.header{

flex-direction:column;

}

.teams{

gap:5px;

}

.team{

width:32%;

}

.team-logo{

width:65px;

height:65px;

}

.team-name{

font-size:14px;

}

.center{

min-width:80px;

}

.score{

font-size:40px;

}

.info{

grid-template-columns:1fr;

}

.section{

padding:15px;

}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">

TJ <span>FOOTBALL</span> ⚽

</div>

<a href="index.html" class="back">

← العودة إلى الرئيسية

</a>

</div>

</header>


<div class="container">

<div id="match-container">

<div class="loading">

جاري تحميل تفاصيل المباراة...

</div>

</div>

</div>


<footer>

TJ FOOTBALL ⚽

<br>

شغف • إثارة • كرة القدم

</footer>


<script>

async function getJSON(file){

const response =
await fetch(file+"?v="+Date.now());

if(!response.ok){

throw new Error("تعذر تحميل "+file);

}

return response.json();

}


function teamName(team){

return team?.shortName ||
team?.name ||
"غير معروف";

}


function teamLogo(team){

if(team?.logo){

return team.logo;

}

if(team?.id){

return `https://media.api-sports.io/football/teams/${team.id}.png`;

}

return "";

}


function formatDate(date){

if(!date){

return "غير متوفر";

}

return new Date(date).toLocaleString(
"ar-TN",
{

day:"2-digit",

month:"long",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}

);

}


function statusText(status){

switch(status){

case "SCHEDULED":
return "قادمة";

case "TIMED":
return "موعد المباراة";

case "IN_PLAY":
return "مباشر الآن";

case "PAUSED":
return "استراحة";

case "FINISHED":
return "انتهت";

default:
return status || "غير معروف";

}

}


function isLive(status){

return (

status === "IN_PLAY" ||

status === "PAUSED"

);

}


function getMatchId(){

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


function findMatch(matches,id){

if(!id){

return matches[0];

}

const found =
matches.find(
m =>
String(m.id) === String(id)
);

return found || matches[0];

}


function renderMatch(match){

const home =
match.homeTeam || {};

const away =
match.awayTeam || {};

const homeScore =
match.score?.fullTime?.home;

const awayScore =
match.score?.fullTime?.away;

const status =
match.status || "SCHEDULED";

const live =
isLive(status);

const container =
document.getElementById(
"match-container"
);

container.innerHTML = `

<div class="competition">

${match.competition?.name || "مباراة كرة القدم"}

</div>


<div class="status ${live ? "live" : ""}">

<span>

${live ? "🔴 " : ""}

${statusText(status)}

</span>

</div>


<div class="score-card">

<div class="teams">


<div class="team">

<img

class="team-logo"

src="${teamLogo(home)}"

onerror="this.style.visibility='hidden'"

alt="${teamName(home)}"

>

<div class="team-name">

${teamName(home)}

</div>

</div>


<div class="center">

<div class="score">

${
homeScore !== undefined &&
homeScore !== null
?
`${homeScore} - ${awayScore ?? 0}`
:
"VS"
}

</div>

<div class="vs">

${
status === "FINISHED"
?
"النتيجة النهائية"
:
formatDate(match.utcDate)
}

</div>

</div>


<div class="team">

<img

class="team-logo"

src="${teamLogo(away)}"

onerror="this.style.visibility='hidden'"

alt="${teamName(away)}"

>

<div class="team-name">

${teamName(away)}

</div>

</div>


</div>


<div class="info">


<div class="info-box">

<div class="info-title">

📅 التاريخ

</div>

<div class="info-value">

${formatDate(match.utcDate)}

</div>

</div>


<div class="info-box">

<div class="info-title">

🏆 البطولة

</div>

<div class="info-value">

${match.competition?.name || "غير معروف"}

</div>

</div>


<div class="info-box">

<div class="info-title">

🏟️ الملعب

</div>

<div class="info-value">

${match.venue?.name || "غير متوفر"}

</div>

</div>


</div>

</div>


<div class="section">

<h2>

⚽ أحداث المباراة

</h2>

<div id="events">

<div class="loading">

لا توجد أحداث مسجلة حاليًا.

</div>

</div>

</div>


<div class="section">

<h2>

📊 إحصائيات المباراة

</h2>

<div id="stats">

<div class="loading">

الإحصائيات غير متوفرة حاليًا.

</div>

</div>

</div>

`;

}


async function loadMatch(){

try{

const data =
await getJSON(
"data/matches.json"
);

const matches =
data.matches || [];

if(!matches.length){

throw new Error(
"لا توجد مباريات"
);

}

const id =
getMatchId();

const match =
findMatch(matches,id);

if(!match){

throw new Error(
"المباراة غير موجودة"
);

}

renderMatch(match);

}catch(error){

console.error(error);

document.getElementById(
"match-container"
).innerHTML = `

<div class="error">

<h2>⚠️ تعذر تحميل المباراة</h2>

<br>

<p>

لم نتمكن من العثور على تفاصيل هذه المباراة.

</p>

<br>

<a

href="index.html"

style="
color:white;
text-decoration:none;
background:#ff1744;
padding:10px 18px;
border-radius:10px;
display:inline-block;
"

>

العودة إلى المباريات

</a>

</div>

`;

}

}


loadMatch();

</script>

</body>

</html>
