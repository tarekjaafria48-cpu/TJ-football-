name: TJ Football API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare data
        run: mkdir -p data

      # =========================
      # FOOTBALL-DATA.ORG
      # =========================

      - name: Get football matches
        env:
          TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAY3=$(date -u -d "+3 days" +%Y-%m-%d)

          curl -s \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/matches?dateFrom=$TODAY&dateTo=$DAY3&limit=500" \
            -o data/matches.json

      - name: Get Premier League standings
        env:
          TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/PL/standings" \
            -o data/premier-league-standings.json

      - name: Get Premier League scorers
        env:
          TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/PL/scorers?limit=20" \
            -o data/premier-league-scorers.json

      - name: Get La Liga standings
        env:
          TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/PD/standings" \
            -o data/la-liga-standings.json

      - name: Get La Liga scorers
        env:
          TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/PD/scorers?limit=20" \
            -o data/la-liga-scorers.json

      # =========================
      # NEWS
      # =========================

      - name: Get football news
        env:
          NEWS_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          curl -s \
            "https://newsapi.org/v2/everything?q=football&language=en&sortBy=publishedAt&pageSize=30&apiKey=$NEWS_KEY" \
            -o data/news.json

      # =========================
      # TRANSFERS
      # =========================
      # Several major clubs.
      # API-Football /transfers accepts team IDs.

      - name: Get transfers
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |

          echo '{"transfers":[]}' > data/transfers.json

          for TEAM in 33 40 42 49 50 529 541 157 492 496; do

            echo "Getting transfers for team $TEAM"

            curl -s \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/transfers?team=$TEAM" \
              -o "data/transfer_$TEAM.json"

          done

          python3 <<'PY'
          import json
          import glob

          output = []

          for filename in glob.glob("data/transfer_*.json"):

              try:
                  with open(filename, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  for item in data.get("response", []):
                      output.append(item)

              except Exception as e:
                  print("Could not read:", filename, e)

          # Remove duplicate player records
          unique = {}

          for item in output:
              player = item.get("player", {})
              pid = player.get("id")

              if pid is not None:
                  unique[pid] = item

          result = {
              "get": "transfers",
              "results": len(unique),
              "response": list(unique.values())
          }

          with open(
              "data/transfers.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Transfer records:", len(unique))
          PY

          rm -f data/transfer_*.json

      # =========================
      # CHECK
      # =========================

      - name: Check data
        run: |
          echo "Files:"
          ls -lh data/

          echo "Transfers:"
          python3 - <<'PY'
          import json

          with open("data/transfers.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Transfer records:", len(data.get("response", [])))
          PY

      # =========================
      # SAVE
      # =========================

      - name: Save data
        run: |

          git config user.name "TJ Football Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update TJ Football data"
            git push
          fi
