<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TJ Football ⚽</title>

  <meta
    name="description"
    content="TJ Football - نتائج ومباريات كرة القدم مباشرة"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #152c4d 0%,
          #071321 45%,
          #03070d 100%
        );

      color: #ffffff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(3, 9, 18, 0.96);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      padding: 15px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 54px;
      height: 54px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #ff1744,
          #e60046,
          #245cff
        );

      font-size: 28px;
      font-weight: 900;

      box-shadow:
        0 8px 25px rgba(255, 23, 68, 0.25);
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand-text p {
      color: #9ba9bd;
      font-size: 12px;
      margin-top: 3px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #ff3158;
      font-weight: bold;
      font-size: 13px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff1744;

      box-shadow:
        0 0 12px rgba(255,23,68,0.8);

      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto 0;
      padding: 20px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;

      border-radius: 28px;

      padding: 35px 25px;

      background:
        linear-gradient(
          135deg,
          rgba(21, 45, 76, 0.95),
          rgba(8, 18, 32, 0.98)
        );

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.3);
    }

    .hero-card::before {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      border-radius: 50%;

      background: rgba(255, 23, 68, 0.14);

      filter: blur(45px);

      left: -70px;
      top: -80px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: clamp(35px, 8vw, 65px);
      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff416c,
          #ff9a9e,
          #61a5ff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 10px;
    }

    .hero-subtitle {
      color: #d9e0ea;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .hero-description {
      color: #8fa1b8;
      font-size: 15px;
      line-height: 1.8;
    }

    .controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 20px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      border: none;
      cursor: pointer;

      padding: 12px 22px;

      border-radius: 30px;

      background: #101d2d;
      color: #b9c5d5;

      font-size: 15px;
      font-weight: 800;

      border: 1px solid rgba(255,255,255,0.08);

      transition: 0.2s;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background:
        linear-gradient(
          135deg,
          #ff1744,
          #e60046
        );

      color: white;

      box-shadow:
        0 8px 25px rgba(255,23,68,0.25);
    }

    .refresh-btn {
      border: 1px solid rgba(255,255,255,0.1);

      background: #101d2d;
      color: white;

      padding: 12px 18px;

      border-radius: 14px;

      cursor: pointer;

      font-weight: bold;

      transition: 0.2s;
    }

    .refresh-btn:hover {
      background: #18283d;
    }

    .status {
      max-width: 1100px;
      margin: 0 auto 18px;
      padding: 0 20px;
    }

    .status-box {
      display: none;

      padding: 14px 18px;

      border-radius: 14px;

      background: rgba(16,29,45,0.9);

      border: 1px solid rgba(255,255,255,0.08);

      color: #aebbd0;

      text-align: center;
    }

    .status-box.show {
      display: block;
    }

    .main {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 900;
    }

    .section-label {
      color: #ff3158;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .count {
      color: #7f91a8;
      font-size: 13px;
    }

    .matches {
      display: grid;
      gap: 14px;
    }

    .league {
      overflow: hidden;

      border-radius: 20px;

      background:
        rgba(7, 18, 32, 0.95);

      border:
        1px solid rgba(255,255,255,0.08);
    }

    .league-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 16px;

      background:
        rgba(255,255,255,0.025);

      border-bottom:
        1px solid rgba(255,255,255,0.06);
    }

    .league-name {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 900;
    }

    .league-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .country {
      color: #71839b;
      font-size: 12px;
      margin-top: 3px;
    }

    .match-card {
      display: grid;

      grid-template-columns:
        1fr 105px 1fr;

      align-items: center;

      min-height: 120px;

      padding: 18px;

      border-bottom:
        1px solid rgba(255,255,255,0.05);
    }

    .match-card:last-child {
      border-bottom: none;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team.home {
      justify-content: flex-start;
    }

    .team.away {
      justify-content: flex-end;
      text-align: left;
    }

    .team-info {
      min-width: 0;
    }

    .team-name {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.4;
    }

    .team-logo {
      width: 44px;
      height: 44px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .score-area {
      text-align: center;
    }

    .score {
      font-size: 25px;
      font-weight: 900;
    }

    .time {
      color: #9aa8bb;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .status-live {
      display: inline-block;

      padding: 4px 9px;

      border-radius: 20px;

      background: rgba(255,23,68,0.14);

      color: #ff3158;

      font-size: 11px;
      font-weight: 900;
    }

    .status-finished {
      color: #62d68b;
      font-size: 11px;
      font-weight: 900;
    }

    .status-upcoming {
      color: #61a5ff;
      font-size: 11px;
      font-weight: 900;
    }

    .empty {
      text-align: center;

      padding: 45px 20px;

      border-radius: 20px;

      background: rgba(7,18,32,0.9);

      border:
        1px solid rgba(255,255,255,0.08);

      color: #8d9db2;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .error {
      color: #ff7c96;
    }

    .footer {
      max-width: 1100px;
      margin: auto;

      padding: 25px 20px 40px;

      text-align: center;

      color: #62748a;

      font-size: 12px;
    }

    @media (max-width: 650px) {

      .header-inner {
        gap: 10px;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .live-indicator {
        font-size: 11px;
      }

      .hero {
        padding: 15px;
      }

      .hero-card {
        padding: 28px 20px;
        border-radius: 22px;
      }

      .hero-subtitle {
        font-size: 18px;
      }

      .controls {
        padding: 0 15px 15px;
      }

      .filter-group {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .refresh-btn {
        width: 100%;
      }

      .main {
        padding: 0 15px 40px;
      }

      .match-card {
        grid-template-columns:
          1fr 75px 1fr;

        padding: 14px 10px;

        min-height: 105px;
      }

      .team-logo {
        width: 36px;
        height: 36px;
      }

      .team-name {
        font-size: 12px;
      }

      .score {
        font-size: 22px;
      }

      .league-header {
        padding: 12px;
      }

      .section-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <div class="brand">
        <div class="logo">⚽</div>

        <div class="brand-text">
          <h1>TJ FOOTBALL</h1>
          <p>نبض كرة القدم</p>
        </div>
      </div>

      <div class="live-indicator">
        <span class="live-dot"></span>
        LIVE
      </div>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-card">

      <div class="hero-content">

        <div class="hero-title">
          TJ FOOTBALL
        </div>

        <div class="hero-subtitle">
          كرة القدم... بأسلوب آخر ⚽
        </div>

        <div class="hero-description">
          تابع المباريات والنتائج المباشرة
          في تجربة واحدة سريعة وبسيطة.
        </div>

      </div>

    </div>

  </section>


  <!-- CONTROLS -->
  <div class="controls">

    <div class="filter-group">

      <button
        id="allButton"
        class="filter-btn active"
        type="button"
      >
        ALL ⚽
      </button>

      <button
        id="liveButton"
        class="filter-btn"
        type="button"
      >
        LIVE 🔴
      </button>

    </div>

    <button
      id="refreshButton"
      class="refresh-btn"
      type="button"
    >
      🔄 تحديث
    </button>

  </div>


  <!-- STATUS -->
  <div class="status">

    <div
      id="statusBox"
      class="status-box"
    ></div>

  </div>


  <!-- MAIN -->
  <main class="main">

    <section class="section">

      <div class="section-header">

        <div>
          <div class="section-label">
            FOOTBALL
          </div>

          <div class="section-title">
            ⚽ المباريات
          </div>
        </div>

        <div
          id="matchCount"
          class="count"
        >
          0 مباراة
        </div>

      </div>


      <div
        id="matchesContainer"
        class="matches"
      >

        <div class="empty">

          <div class="empty-icon">
            ⚽
          </div>

          <div>
            جاري تحميل المباريات...
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">
    TJ Football ⚽
    <br>
    Live Football Scores
  </footer>


  <script>
    /*
      TJ FOOTBALL
      Main frontend
      Backend:
      /api/football?type=all
      /api/football?type=live
    */

    let matches = [];
    let mode = "all";


    /*
      DOM
    */

    const matchesContainer =
      document.getElementById("matchesContainer");

    const matchCount =
      document.getElementById("matchCount");

    const statusBox =
      document.getElementById("statusBox");

    const allButton =
      document.getElementById("allButton");

    const liveButton =
      document.getElementById("liveButton");

    const refreshButton =
      document.getElementById("refreshButton");


    /*
      STATUS MESSAGE
    */

    function showStatus(message, isError = false) {

      statusBox.innerHTML = message;

      statusBox.classList.add("show");

      if (isError) {
        statusBox.classList.add("error");
      } else {
        statusBox.classList.remove("error");
      }

    }


    function hideStatus() {

      statusBox.innerHTML = "";

      statusBox.classList.remove("show");
      statusBox.classList.remove("error");

    }


    /*
      ESCAPE HTML
      حماية النصوص القادمة من API
    */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      FORMAT TIME
    */

    function formatTime(dateString) {

      if (!dateString) {
        return "--:--";
      }

      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "--:--";
      }

      return new Intl.DateTimeFormat(
        "ar-TN",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Africa/Tunis"
        }
      ).format(date);

    }


    /*
      MATCH STATUS
    */

    function getMatchStatus(match) {

      const status =
        match &&
        match.fixture &&
        match.fixture.status
          ? match.fixture.status
          : {};

      const short =
        status.short || "";

      const long =
        status.long || "";

      const elapsed =
        status.elapsed;


      const liveStatuses = [
        "1H",
        "2H",
        "ET",
        "BT",
        "P",
        "LIVE"
      ];

      const finishedStatuses = [
        "FT",
        "AET",
        "PEN"
      ];

      if (
        liveStatuses.includes(short)
      ) {

        return {
          type: "live",
          text:
            elapsed !== null &&
            elapsed !== undefined
              ? "مباشر " + elapsed + "'"
              : "مباشر"
        };

      }


      if (
        finishedStatuses.includes(short)
      ) {

        return {
          type: "finished",
          text: "انتهت"
        };

      }


      if (
        long.toLowerCase().includes("first half") ||
        long.toLowerCase().includes("second half")
      ) {

        return {
          type: "live",
          text:
            elapsed !== null &&
            elapsed !== undefined
              ? "مباشر " + elapsed + "'"
              : "مباشر"
        };

      }


      return {
        type: "upcoming",
        text: formatTime(
          match.fixture.date
        )
      };

    }


    /*
      SCORE
    */

    function getScore(match) {

      const goals =
        match && match.goals
          ? match.goals
          : {};

      const home =
        goals.home !== null &&
        goals.home !== undefined
          ? goals.home
          : 0;

      const away =
        goals.away !== null &&
        goals.away !== undefined
          ? goals.away
          : 0;

      return {
        home,
        away
      };

    }


    /*
      LOGO FALLBACK
    */

    function teamLogo(team) {

      if (
        team &&
        team.logo
      ) {
        return escapeHTML(team.logo);
      }

      return "";
    }


    /*
      CREATE TEAM HTML
    */

    function createTeam(team, side) {

      const name =
        team && team.name
          ? team.name
          : "غير معروف";

      const logo =
        teamLogo(team);

      const imageHTML =
        logo
          ? `
            <img
              class="team-logo"
              src="${logo}"
              alt=""
              loading="lazy"
              onerror="this.style.display='none'"
            >
          `
          : `
            <div
              class="team-logo"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:24px;
              "
            >
              ⚽
            </div>
          `;


      return `
        <div class="team ${side}">

          ${
            side === "home"
              ? imageHTML
              : ""
          }

          <div class="team-info">
            <div class="team-name">
              ${escapeHTML(name)}
            </div>
          </div>

          ${
            side === "away"
              ? imageHTML
              : ""
          }

        </div>
      `;

    }


    /*
      CREATE MATCH CARD
    */

    function createMatchCard(match) {

      const home =
        match &&
        match.teams &&
        match.teams.home
          ? match.teams.home
          : {};

      const away =
        match &&
        match.teams &&
        match.teams.away
          ? match.teams.away
          : {};

      const score =
        getScore(match);

      const status =
        getMatchStatus(match);


      let statusHTML = "";


      if (status.type === "live") {

        statusHTML = `
          <span class="status-live">
            ${escapeHTML(status.text)}
          </span>
        `;

      } else if (
        status.type === "finished"
      ) {

        statusHTML = `
          <span class="status-finished">
            ${escapeHTML(status.text)}
          </span>
        `;

      } else {

        statusHTML = `
          <span class="status-upcoming">
            ${escapeHTML(status.text)}
          </span>
        `;

      }


      return `
        <div class="match-card">

          ${createTeam(home, "home")}

          <div class="score-area">

            <div class="time">
              ${formatTime(match.fixture?.date)}
            </div>

            <div class="score">
              ${score.home}
              -
              ${score.away}
            </div>

            <div>
              ${statusHTML}
            </div>

          </div>

          ${createTeam(away, "away")}

        </div>
      `;

    }


    /*
      GROUP MATCHES BY LEAGUE
    */

    function groupByLeague(list) {

      const groups = {};

      list.forEach(function(match) {

        const league =
          match &&
          match.league
            ? match.league
            : {};

        const id =
          league.id ||
          "unknown";

        if (!groups[id]) {

          groups[id] = {
            league: league,
            matches: []
          };

        }

        groups[id].matches.push(match);

      });

      return Object.values(groups);

    }


    /*
      CREATE LEAGUE
    */

    function createLeague(group) {

      const league =
        group.league || {};

      const name =
        league.name ||
        "بطولة غير معروفة";

      const country =
        league.country ||
        "";

      const logo =
        league.logo
          ? escapeHTML(league.logo)
          : "";


      const logoHTML =
        logo
          ? `
            <img
              class="league-logo"
              src="${logo}"
              alt=""
              loading="lazy"
              onerror="this.style.display='none'"
            >
          `
          : `
            <span style="font-size:25px">
              🏆
            </span>
          `;


      return `
        <div class="league">

          <div class="league-header">

            <div class="league-name">

              ${logoHTML}

              <div>
