<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJ Football ⚽</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    color: #111;
}

header {
    background: linear-gradient(135deg, #e50914, #071a52);
    color: white;
    text-align: center;
    padding: 28px 10px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

nav {
    background: white;
    text-align: center;
    padding: 15px;
}

button {
    border: 0;
    padding: 11px 22px;
    margin: 4px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
}

.active {
    background: #e50914;
    color: white;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.message {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    margin-top: 15px;
    font-size: 18px;
}

.league {
    background: white;
    margin-top: 15px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.league-title {
    background: #071a52;
    color: white;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
}

.match {
    padding: 18px 10px;
    border-bottom: 1px solid #eee;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    text-align: center;
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-weight: bold;
}

.team img {
    width: 45px;
    height: 45px;
    object-fit: contain;
}

.score {
    font-size: 23px;
    font-weight: bold;
}

.status {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    color: #e50914;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>⚽ TJ Football</h1>
    <p>Live Football Scores</p>
</header>

<nav>
    <button id="allButton">ALL ⚽</button>
    <button id="liveButton" class="active">LIVE 🔴</button>
</nav>

<main>
    <div id="app">
        <div class="message">
            ⏳ جاري الاتصال...
        </div>
    </div>
</main>

<script>

var matches = [];
var mode = "live";

var app = document.getElementById("app");
var allButton = document.getElementById("allButton");
var liveButton = document.getElementById("liveButton");


function showMessage(text) {
    app.innerHTML =
        "<div class='message'>" +
        text +
        "</div>";
}


async function loadFootball() {

    showMessage("⏳ جاري جلب المباريات...");

    try {

        var url =
            "/api/football?time=" +
            new Date().getTime();

        var response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        var json =
            await response.json();


        console.log("TJ FOOTBALL API:", json);


        if (
            json &&
            Array.isArray(json.response)
        ) {

            matches = json.response;

        } else if (
            Array.isArray(json)
        ) {

            matches = json;

        } else {

            matches = [];

        }


        renderMatches();

    } catch (error) {

        console.log("TJ FOOTBALL ERROR:", error);

        showMessage(
            "❌ خطأ في الاتصال بالـAPI<br><br>" +
            error.message
        );

    }

}


function renderMatches() {

    var list = [];

    var i;


    for (i = 0; i < matches.length; i++) {

        var match =
            matches[i];

        if (!match || !match.fixture) {
            continue;
        }


        if (mode === "all") {

            list.push(match);

        } else {

            var status =
                match.fixture.status &&
                match.fixture.status.short
                ? match.fixture.status.short
                : "";


            if (
                status === "1H" ||
                status === "2H" ||
                status === "HT" ||
                status === "ET" ||
                status === "P" ||
                status === "LIVE"
            ) {

                list.push(match);

            }

        }

    }


    if (list.length === 0) {

        if (mode === "live") {

            showMessage(
                "🔴 لا توجد مباريات مباشرة حاليًا"
            );

        } else {

            showMessage(
                "⚽ لا توجد مباريات في بيانات الـAPI حاليًا"
            );

        }

        return;

    }


    app.innerHTML = "";


    for (i = 0; i < list.length; i++) {

        var match =
            list[i];


        var leagueName =
            match.league &&
            match.league.name
            ? match.league.name
            : "Football";


        var country =
            match.league &&
            match.league.country
            ? match.league.country
            : "";


        var home =
            match.teams &&
            match.teams.home &&
            match.teams.home.name
            ? match.teams.home.name
            : "Home";


        var away =
            match.teams &&
            match.teams.away &&
            match.teams.away.name
            ? match.teams.away.name
            : "Away";


        var homeLogo =
            match.teams &&
            match.teams.home &&
            match.teams.home.logo
            ? match.teams.home.logo
            : "";


        var awayLogo =
            match.teams &&
            match.teams.away &&
            match.teams.away.logo
            ? match.teams.away.logo
            : "";


        var homeScore =
            match.goals &&
            match.goals.home !== null &&
            match.goals.home !== undefined
            ? match.goals.home
            : 0;


        var awayScore =
            match.goals &&
            match.goals.away !== null &&
            match.goals.away !== undefined
            ? match.goals.away
            : 0;


        var status =
            match.fixture.status &&
            match.fixture.status.short
            ? match.fixture.status.short
            : "";


        var statusText =
            status;


        if (
            status === "1H" ||
            status === "2H" ||
            status === "HT" ||
            status === "ET" ||
            status === "P" ||
            status === "LIVE"
        ) {

            statusText = "🔴 LIVE";

            if (
                match.fixture.status.elapsed
            ) {

                statusText +=
                    " " +
                    match.fixture.status.elapsed +
                    "'";

            }

        }


        var box =
            document.createElement("div");

        box.className =
            "league";


        var title =
            document.createElement("div");

        title.className =
            "league-title";

        title.textContent =
            "🏆 " +
            leagueName +
            " - " +
            country;


        box.appendChild(title);


        var game =
            document.createElement("div");

        game.className =
            "match";


        game.innerHTML =
            "<div class='teams'>" +

            "<div class='team'>" +
            "<img src='" +
            homeLogo +
            "' alt=''>" +
            "<span>" +
            home +
            "</span>" +
            "</div>" +

            "<div class='score'>" +
            homeScore +
            " : " +
            awayScore +
            "</div>" +

            "<div class='team'>" +
            "<img src='" +
            awayLogo +
            "' alt=''>" +
            "<span>" +
            away +
            "</span>" +
            "</div>" +

            "</div>" +

            "<div class='status'>" +
            statusText +
            "</div>";


        box.appendChild(game);

        app.appendChild(box);

    }

}


allButton.onclick =
function() {

    mode = "all";

    allButton.className =
        "active";

    liveButton.className =
        "";

    renderMatches();

};


liveButton.onclick =
function() {

    mode = "live";

    liveButton.className =
        "active";

    allButton.className =
        "";

    renderMatches();

};


loadFootball();


setInterval(
    loadFootball,
    60000
);

</script>

</body>
</html>
