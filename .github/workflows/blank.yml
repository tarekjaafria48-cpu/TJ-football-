<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>TJ Football ⚽</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:
radial-gradient(circle at 10% 10%,#102b52 0,#06111f 35%,#020711 100%);
color:#fff;
min-height:100vh;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(120deg,transparent 30%,rgba(255,0,40,.04),transparent 70%);
}


/* =========================
   HEADER
========================= */

header{
position:relative;
overflow:hidden;
padding:20px;
background:
linear-gradient(135deg,#050b16,#071a32 50%,#16040a);
border-bottom:1px solid #26364d;
}

.header-inner{
max-width:1250px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo-shield{
width:65px;
height:75px;
background:
linear-gradient(145deg,#e5092f,#a60020);
clip-path:polygon(50% 0,92% 14%,86% 72%,50% 100%,14% 72%,8% 14%);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:1000;
text-shadow:0 2px 5px #000;
box-shadow:0 0 30px #e5092f66;
}

.logo-text h1{
font-size:28px;
font-style:italic;
letter-spacing:1px;
}

.logo-text p{
font-size:12px;
color:#9fb1c8;
margin-top:4px;
}

nav{
display:flex;
gap:7px;
overflow-x:auto;
max-width:1250px;
margin:15px auto 0;
scrollbar-width:none;
}

nav a{
color:#dce7f5;
text-decoration:none;
padding:10px 15px;
border-radius:12px;
white-space:nowrap;
font-weight:bold;
font-size:14px;
border:1px solid transparent;
transition:.2s;
}

nav a:hover{
background:#e5092f;
color:#fff;
}


/* =========================
   HERO
========================= */

main{
max-width:1250px;
margin:auto;
padding:18px;
}

.hero{
position:relative;
overflow:hidden;
min-height:330px;
border-radius:25px;
padding:45px;
display:flex;
align-items:center;
background:
radial-gradient(circle at 75% 50%,#173b70 0,transparent 35%),
linear-gradient(110deg,#07111f,#081a33 55%,#13050a);
border:1px solid #293c57;
box-shadow:0 20px 60px #0008;
}

.hero:after{
content:"⚽";
position:absolute;
left:-40px;
bottom:-70px;
font-size:300px;
opacity:.035;
transform:rotate(-15deg);
}

.hero-content{
position:relative;
z-index:2;
max-width:650px;
}

.hero h2{
font-size:48px;
font-weight:1000;
font-style:italic;
background:linear-gradient(90deg,#ff173d,#fff,#247cff);
-webkit-background-clip:text;
color:transparent;
}

.hero h3{
font-size:25px;
margin:15px 0;
}

.hero p{
color:#aabbd0;
font-size:16px;
line-height:1.8;
}

.hero-badge{
display:inline-block;
margin-top:20px;
padding:10px 18px;
border-radius:30px;
background:#e5092f;
font-weight:bold;
box-shadow:0 0 25px #e5092f55;
}


/* =========================
   SECTION
========================= */

.section{
margin-top:22px;
background:rgba(5,15,28,.88);
border:1px solid #26384f;
border-radius:22px;
padding:20px;
box-shadow:0 15px 45px #0007;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.section-title h2{
font-size:21px;
}

.section-title span{
color:#ff183e;
font-size:13px;
}


/* =========================
   MATCHES
========================= */

.match-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));
gap:13px;
}

.match{
background:
linear-gradient(145deg,#0b1a2d,#06101d);
border:1px solid #20354f;
border-radius:17px;
padding:17px;
text-align:center;
transition:.25s;
}

.match:hover{
transform:translateY(-4px);
border-color:#e5092f;
box-shadow:0 10px 30px #e5092f22;
}

.match-league{
font-size:12px;
color:#8fa3bc;
margin-bottom:12px;
}

.teams{
display:flex;
align-items:center;
justify-content:space-around;
gap:10px;
}

.team{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
width:90px;
}

.team img{
width:52px;
height:52px;
object-fit:contain;
}

.team-name{
font-size:13px;
font-weight:bold;
}

.match-time{
font-size:22px;
font-weight:900;
color:#ff193f;
}

.match-date{
font-size:11px;
color:#7589a2;
margin-top:10px;
}


/* =========================
   COLUMNS
========================= */

.three-columns{
display:grid;
grid-template-columns:
1fr 1.5fr 1fr;
gap:18px;
}

@media(max-width:950px){
.three-columns{
grid-template-columns:1fr;
}
}


/* =========================
   NEWS
========================= */

.news-card{
display:flex;
gap:12px;
padding:12px 0;
border-bottom:1px solid #1d2c40;
}

.news-card:last-child{
border-bottom:0;
}

.news-card img{
width:90px;
height:65px;
object-fit:cover;
border-radius:10px;
}

.news-card h3{
font-size:14px;
line-height:1.5;
}

.news-card small{
color:#72859d;
display:block;
margin-top:6px;
}


/* =========================
   TRANSFERS
========================= */

.transfer{
position:relative;
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:15px;
background:
linear-gradient(100deg,#091a2d,#07101c);
border:1px solid #20344c;
transition:.2s;
}

.transfer:hover{
border-color:#e5092f;
transform:translateX(-3px);
}

.player-photo{
width:58px;
height:58px;
object-fit:cover;
border-radius:50%;
background:#15263a;
border:2px solid #263d59;
}

.transfer-info{
flex:1;
}

.player-name{
font-weight:900;
font-size:15px;
}

.transfer-clubs{
display:flex;
align-items:center;
gap:8px;
margin-top:9px;
font-size:12px;
color:#a8b9cd;
}

.club{
display:flex;
align-items:center;
gap:5px;
}

.club img{
width:25px;
height:25px;
object-fit:contain;
}

.arrow{
color:#ff1740;
font-size:18px;
font-weight:bold;
}

.transfer-date{
font-size:11px;
color:#667c95;
margin-top:7px;
}


/* =========================
   RESULTS
========================= */

.result{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 5px;
border-bottom:1px solid #1d2c40;
}

.result-team{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
font-weight:bold;
}

.result-team img{
width:32px;
height:32px;
object-fit:contain;
}

.result-score{
font-size:20px;
font-weight:1000;
color:#fff;
}


/* =========================
   TABLE
========================= */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:520px;
}

th{
background:#0d2138;
color:#ff2145;
padding:12px 8px;
font-size:12px;
}

td{
padding:11px 8px;
border-bottom:1px solid #17283c;
text-align:center;
font-size:13px;
}

.club-cell{
display:flex;
align-items:center;
gap:8px;
font-weight:bold;
}

.club-cell img{
width:28px;
height:28px;
object-fit:contain;
}


/* =========================
   SCORERS
========================= */

.scorer{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-bottom:1px solid #1b2b40;
}

.scorer img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
background:#15263a;
}

.scorer-info{
flex:1;
}

.scorer-name{
font-weight:bold;
}

.scorer-team{
font-size:11px;
color:#71859d;
margin-top:5px;
}

.goals{
font-size:21px;
font-weight:900;
color:#ff1a40;
}


/* =========================
   BUTTON
========================= */

.btn{
display:block;
text-align:center;
margin-top:15px;
padding:11px;
border:1px solid #e5092f;
border-radius:10px;
color:#fff;
text-decoration:none;
font-weight:bold;
background:#e5092f12;
transition:.2s;
}

.btn:hover{
background:#e5092f;
}


/* =========================
   FOOTER
========================= */

footer{
margin-top:30px;
padding:35px 20px;
text-align:center;
background:#030914;
border-top:1px solid #1d3048;
}

.footer-logo{
font-size:30px;
font-weight:1000;
font-style:italic;
color:#e5092f;
}

footer p{
color:#70849b;
font-size:12px;
margin-top:8px;
}


/* =========================
   LOADING
========================= */

.loading{
text-align:center;
padding:25px;
color:#71859d;
}

.error{
padding:15px;
border-radius:12px;
background:#3a0d16;
color:#ff8297;
}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">

<div class="logo-shield">
TJ
</div>

<div class="logo-text">

<h1>TJ FOOTBALL</h1>

<p>نبض كرة القدم في مكان واحد</p>

</div>

</div>

</div>


<nav>

<a href="#home">🏠 الرئيسية</a>
<a href="#matches">⚽ المباريات</a>
<a href="#news">📰 الأخبار</a>
<a href="#transfers">🔄 الانتقالات</a>
<a href="#results">📊 النتائج</a>
<a href="#tables">🏆 الترتيب</a>
<a href="#scorers">⭐ الهدافون</a>

</nav>

</header>



<main>


<!-- HERO -->

<section id="home" class="hero">

<div class="hero-content">

<h2>TJ FOOTBALL</h2>

<h3>كل ما يخص كرة القدم في مكان واحد ⚽</h3>

<p>
مباريات، نتائج، أخبار، انتقالات،
ترتيب البطولات والهدافين
في تجربة كروية عصرية وحماسية.
</p>

<span class="hero-badge">
🔥 شغف لا ينتهي
</span>

</div>

</section>



<!-- MATCHES -->

<section id="matches" class="section">

<div class="section-title">

<h2>⚽ المباريات القادمة</h2>

<span>LIVE FOOTBALL</span>

</div>

<div id="matches-container">

<div class="loading">
جاري تحميل المباريات...
</div>

</div>

</section>



<!-- MAIN COLUMNS -->

<div class="three-columns">


<!-- NEWS -->

<section id="news" class="section">

<div class="section-title">

<h2>📰 آخر الأخبار</h2>

</div>

<div id="news-container">

<div class="loading">
جاري تحميل الأخبار...
</div>

</div>

</section>



<!-- TRANSFERS -->

<section id="transfers" class="section">

<div class="section-title">

<h2>🔄 أحدث الانتقالات</h2>

<span>TRANSFER CENTER</span>

</div>

<div id="transfers-container">

<div class="loading">
جاري تحميل الانتقالات...
</div>

</div>

</section>



<!-- RESULTS -->

<section id="results" class="section">

<div class="section-title">

<h2>📊 آخر النتائج</h2>

</div>

<div id="results-container">

<div class="loading">
جاري تحميل النتائج...
</div>

</div>

</section>

</div>



<!-- TABLES -->

<section id="tables" class="section">

<div class="section-title">

<h2>🏆 ترتيب البطولات</h2>

</div>

<div class="three-columns">

<div>

<h3 style="margin-bottom:12px">
🏴 Premier League
</h3>

<div id="plTable">
<div class="loading">
جاري التحميل...
</div>
</div>

</div>


<div>

<h3 style="margin-bottom:12px">
🇪🇸 La Liga
</h3>

<div id="laTable">
<div class="loading">
جاري التحميل...
</div>
</div>

</div>


<div>

<h3 style="margin-bottom:12px">
⭐ الهدافون
</h3>

<div id="plScorers">
<div class="loading">
جاري التحميل...
</div>
</div>

</div>

</div>

</section>


</main>



<footer>

<div class="footer-logo">
TJ FOOTBALL
</div>

<p>
شغف... إثارة... كرة القدم ⚽
</p>

<p>
TJ FOOTBALL © 2026
</p>

</footer>



<script>


/* =========================
   HELPERS
========================= */

async function getJSON(file){

const response =
await fetch(file+"?v="+Date.now());

if(!response.ok)
throw new Error(file);

return await response.json();

}


function teamName(team){

return team?.shortName ||
team?.name ||
"غير معروف";

}


function dateFormat(date){

if(!date)
return "";

return new Date(date).toLocaleString(
"fr-FR",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =========================
   TEAM LOGO
========================= */

function teamLogo(team){

if(team?.logo)
return team.logo;

if(team?.id)
return `https://media.api-sports.io/football/teams/${team.id}.png`;

return "";

}


/* =========================
   PLAYER PHOTO
========================= */

function playerPhoto(player){

if(player?.photo)
return player.photo;

if(player?.id)
return `https://media.api-sports.io/football/players/${player.id}.png`;

return "https://via.placeholder.com/100?text=⚽";

}


/* =========================
   MATCHES
========================= */

async function loadFootball(){

try{

const data =
await getJSON("data/matches.json");

const matches =
data.matches || [];

const upcoming =
matches.filter(
m =>
m.status==="SCHEDULED" ||
m.status==="TIMED"
);

const finished =
matches.filter(
m => m.status==="FINISHED"
);


document.getElementById(
"matches-container"
).innerHTML = upcoming.length ?

`<div class="match-grid">

${upcoming.slice(0,20).map(m=>`

<div class="match">

<div class="match-league">
${m.competition?.name || "مباراة"}
</div>

<div class="teams">

<div class="team">

<img
src="${teamLogo(m.homeTeam)}"
onerror="this.style.display='none'"
>

<span class="team-name">
${teamName(m.homeTeam)}
</span>

</div>

<div>

<div class="match-time">
${new Date(m.utcDate)
.toLocaleTimeString("fr-FR",{
hour:"2-digit",
minute:"2-digit"
})}
</div>

<div class="match-date">
${dateFormat(m.utcDate)}
</div>

</div>

<div class="team">

<img
src="${teamLogo(m.awayTeam)}"
onerror="this.style.display='none'"
>

<span class="team-name">
${teamName(m.awayTeam)}
</span>

</div>

</div>

</div>

`).join("")}

</div>`

:
"<p>لا توجد مباريات قادمة حاليًا.</p>";



document.getElementById(
"results-container"
).innerHTML = finished.length ?

finished.slice(0,12).map(m=>`

<div class="result">

<div class="result-team">

<img
src="${teamLogo(m.homeTeam)}"
onerror="this.style.display='none'"
>

${teamName(m.homeTeam)}

</div>

<div class="result-score">

${m.score?.fullTime?.home ?? "-"}
 -
${m.score?.fullTime?.away ?? "-"}

</div>

<div class="result-team">

${teamName(m.awayTeam)}

<img
src="${teamLogo(m.awayTeam)}"
onerror="this.style.display='none'"
>

</div>

</div>

`).join("")

:
"<p>لا توجد نتائج.</p>";


}catch(e){

console.error(e);

}

}


/* =========================
   NEWS
========================= */

async function loadNews(){

try{

const data =
await getJSON("data/news.json");

const articles =
data.articles || [];

document.getElementById(
"news-container"
).innerHTML =
articles.slice(0,8).map(a=>`

<div class="news-card">

${
a.urlToImage
?
`<img src="${a.urlToImage}">`
:""
}

<div>

<h3>
${a.title || "خبر كروي"}
</h3>

<small>
${a.source?.name || ""}
</small>

</div>

</div>

`).join("");


}catch(e){

console.error(e);

}

}


/* =========================
   TRANSFERS
========================= */

async function loadTransfers(){

try{

const data =
await getJSON("data/transfers.json");

let list=[];


(data.response || []).forEach(item=>{

const player =
item.player || {};

(item.transfers || []).forEach(t=>{

list.push({

player,
transfer:t

});

});

});


/* newest first */

list.sort((a,b)=>{

return new Date(
b.transfer.date || 0
)
-
new Date(
a.transfer.date || 0
);

});


document.getElementById(
"transfers-container"
).innerHTML = list
.slice(0,25)
.map(x=>{

const t=x.transfer;
const p=x.player;

const from=t.teams?.out || {};
const to=t.teams?.in || {};

return `

<div class="transfer">

<img
class="player-photo"
src="${playerPhoto(p)}"
onerror="this.src='https://via.placeholder.com/100?text=⚽'"
>

<div class="transfer-info">

<div class="player-name">
${p.name || "لاعب"}
</div>

<div class="transfer-clubs">

<div class="club">

<img
src="${teamLogo(from)}"
onerror="this.style.display='none'"
>

${from.name || "غير معروف"}

</div>

<div class="arrow">
→
</div>

<div class="club">

<img
src="${teamLogo(to)}"
onerror="this.style.display='none'"
>

${to.name || "غير معروف"}

</div>

</div>

<div class="transfer-date">

📅 ${t.date || "التاريخ غير متوفر"}

${t.type ? " • "+t.type : ""}

</div>

</div>

</div>

`;

}).join("");


}catch(e){

console.error(e);

document.getElementById(
"transfers-container"
).innerHTML =
'<div class="error">تعذر تحميل الانتقالات.</div>';

}

}


/* =========================
   TABLE
========================= */

function makeTable(rows){

if(!rows?.length)
return "<p>لا توجد بيانات.</p>";

return `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>#</th>
<th>النادي</th>
<th>لعب</th>
<th>ف</th>
<th>ت</th>
<th>خ</th>
<th>نقاط</th>

</tr>

</thead>

<tbody>

${rows.slice(0,10).map(r=>`

<tr>

<td>
${r.position || "-"}
</td>

<td>

<div class="club-cell">

<img
src="${teamLogo(r.team)}"
onerror="this.style.display='none'"
>

${r.team?.shortName ||
r.team?.name ||
"-"}

</div>

</td>

<td>
${r.playedGames ?? "-"}
</td>

<td>
${r.won ?? "-"}
</td>

<td>
${r.draw ?? "-"}
</td>

<td>
${r.lost ?? "-"}
</td>

<td>
<b>${r.points ?? "-"}</b>
</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`;

}


async function loadStandings(){

try{

const pl =
await getJSON(
"data/premier-league-standings.json"
);

document.getElementById(
"plTable"
).innerHTML =
makeTable(
pl.standings?.[0]?.table
);


const la =
await getJSON(
"data/la-liga-standings.json"
);

document.getElementById(
"laTable"
).innerHTML =
makeTable(
la.standings?.[0]?.table
);

}catch(e){

console.error(e);

}

}


/* =========================
   SCORERS
========================= */

async function loadScorers(){

try{

const data =
await getJSON(
"data/premier-league-scorers.json"
);

const scorers =
data.scorers || [];

document.getElementById(
"plScorers"
).innerHTML =
scorers.slice(0,8)
.map((s,i)=>`

<div class="scorer">

<img
src="${playerPhoto(s.player)}"
onerror="this.src='https://via.placeholder.com/100?text=⚽'"
>

<div class="scorer-info">

<div class="scorer-name">
${i+1}. ${s.player?.name || "لاعب"}
</div>

<div class="scorer-team">
${s.team?.shortName ||
s.team?.name ||
""}
</div>

</div>

<div class="goals">
${s.goals ?? 0}
</div>

</div>

`).join("");


}catch(e){

console.error(e);

}

}


/* =========================
   START
========================= */

loadFootball();
loadNews();
loadTransfers();
loadStandings();
loadScorers();

</script>

</body>

</html>
