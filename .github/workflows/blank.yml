name: TJ Football API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get football matches
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $FOOTBALL_API_TOKEN" \
            "https://api.football-data.org/v4/matches" \
            -o matches.json

      - name: Save football data
        run: |
          mkdir -p data
          mv matches.json data/matches.json

      - name: Commit updated data
        run: |
          git config user.name "TJ Football Bot"
          git config user.email "actions@github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "Update football matches"
          git push
