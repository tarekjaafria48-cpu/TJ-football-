<!-- ============================= -->
<!-- TJ FOOTBALL NEWS & TRANSFERS -->
<!-- ضع هذا الجزء داخل <body> -->
<!-- ============================= -->

<section class="tj-extra-section">

  <div class="tj-extra-header">
    <div>
      <span class="tj-extra-label">TJ FOOTBALL</span>
      <h2>📰 آخر الأخبار</h2>
    </div>
  </div>

  <div id="newsContainer" class="tj-news-grid">
    <div class="tj-loading">
      جاري تحميل الأخبار...
    </div>
  </div>

</section>


<section class="tj-extra-section">

  <div class="tj-extra-header">
    <div>
      <span class="tj-extra-label">TRANSFERS</span>
      <h2>🔄 آخر الانتقالات</h2>
    </div>
  </div>

  <div id="transfersContainer" class="tj-transfers-list">
    <div class="tj-loading">
      جاري تحميل الانتقالات...
    </div>
  </div>

</section>


<style>

.tj-extra-section {
  max-width: 1100px;
  margin: 35px auto;
  padding: 0 20px;
}

.tj-extra-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.tj-extra-label {
  color: #ff3158;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.tj-extra-header h2 {
  margin-top: 5px;
  font-size: 25px;
  font-weight: 900;
}


/* NEWS */

.tj-news-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 16px;
}

.tj-news-card {
  overflow: hidden;
  border-radius: 20px;

  background:
    rgba(7,18,32,.96);

  border:
    1px solid rgba(255,255,255,.08);

  transition: .25s;
}

.tj-news-card:hover {
  transform: translateY(-4px);
  border-color:
    rgba(255,49,88,.35);
}

.tj-news-image {
  width: 100%;
  height: 175px;

  object-fit: cover;

  display: block;

  background:
    linear-gradient(
      135deg,
      #152c4d,
      #071321
    );
}

.tj-news-content {
  padding: 16px;
}

.tj-news-title {
  font-size: 17px;
  font-weight: 900;
  line-height: 1.5;
}

.tj-news-description {
  margin-top: 8px;

  color: #8fa1b8;

  font-size: 13px;
  line-height: 1.7;
}

.tj-news-date {
  margin-top: 12px;

  color: #ff3158;

  font-size: 11px;
  font-weight: bold;
}


/* TRANSFERS */

.tj-transfers-list {
  display: grid;
  gap: 10px;
}

.tj-transfer-card {
  display: grid;

  grid-template-columns:
    1fr 80px 1fr;

  align-items: center;

  padding: 15px;

  border-radius: 17px;

  background:
    rgba(7,18,32,.96);

  border:
    1px solid rgba(255,255,255,.08);
}

.tj-transfer-player {
  font-weight: 900;
  font-size: 15px;
}

.tj-transfer-team {
  color: #8fa1b8;
  font-size: 12px;
  margin-top: 4px;
}

.tj-transfer-arrow {
  text-align: center;

  font-size: 22px;

  color: #ff3158;
}

.tj-transfer-status {
  text-align: center;

  color: #62d68b;

  font-size: 11px;
  font-weight: 900;
}

.tj-loading,
.tj-empty {
  padding: 35px 20px;

  text-align: center;

  border-radius: 18px;

  background:
    rgba(7,18,32,.95);

  border:
    1px solid rgba(255,255,255,.08);

  color: #8fa1b8;
}


@media (max-width: 750px) {

  .tj-news-grid {
    grid-template-columns: 1fr;
  }

  .tj-news-image {
    height: 190px;
  }

  .tj-transfer-card {
    grid-template-columns:
      1fr 50px 1fr;
  }

}

</style>


<script>

(function () {

  "use strict";


  /*
   * حماية النصوص القادمة من JSON
   */

  function safe(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * NEWS
   *
   * المصدر:
   * /data/news.json
   */

  async function loadNews() {

    const container =
      document.getElementById(
        "newsContainer"
      );

    if (!container) return;


    try {

      const response =
        await fetch(
          "/data/news.json",
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      /*
       * دعم أكثر من شكل للـ JSON
       */

      let news = [];

      if (Array.isArray(data)) {

        news = data;

      } else if (
        Array.isArray(data.news)
      ) {

        news = data.news;

      } else if (
        Array.isArray(data.articles)
      ) {

        news = data.articles;

      }


      if (!news.length) {

        container.innerHTML = `
          <div class="tj-empty">
            📰 لا توجد أخبار حاليًا
          </div>
        `;

        return;

      }


      /*
       * عرض أول 12 خبر
       */

      container.innerHTML =
        news
          .slice(0, 12)
          .map(function (article) {

            const title =
              article.title ||
              article.name ||
              "خبر رياضي";


            const description =
              article.description ||
              article.summary ||
              "";


            const image =
              article.image ||
              article.urlToImage ||
              article.thumbnail ||
              "";


            const date =
              article.date ||
              article.publishedAt ||
              "";


            const link =
              article.url ||
              article.link ||
              "#";


            return `

              <article class="tj-news-card">

                ${
                  image
                    ? `
                      <img
                        class="tj-news-image"
                        src="${safe(image)}"
                        alt=""
                        loading="lazy"
                        onerror="
                          this.style.display='none'
                        "
                      >
                    `
                    : `
                      <div
                        class="tj-news-image"
                        style="
                          display:flex;
                          align-items:center;
                          justify-content:center;
                          font-size:45px;
                        "
                      >
                        ⚽
                      </div>
                    `
                }


                <div class="tj-news-content">

                  <div class="tj-news-title">
                    ${safe(title)}
                  </div>


                  ${
                    description
                      ? `
                        <div class="
                          tj-news-description
                        ">
                          ${safe(
                            description
                          )}
                        </div>
                      `
                      : ""
                  }


                  ${
                    date
                      ? `
                        <div
                          class="tj-news-date"
                        >
                          ${safe(date)}
                        </div>
                      `
                      : ""
                  }


                  ${
                    link !== "#"
                      ? `
                        <a
                          href="${safe(link)}"
                          target="_blank"
                          rel="noopener noreferrer"
                          style="
                            display:inline-block;
                            margin-top:12px;
                            color:#61a5ff;
                            font-size:12px;
                            font-weight:bold;
                            text-decoration:none;
                          "
                        >
                          قراءة الخبر ←
                        </a>
                      `
                      : ""
                  }

                </div>

              </article>

            `;

          })
          .join("");


    } catch (error) {

      console.error(
        "TJ News Error:",
        error
      );


      container.innerHTML = `
        <div class="tj-empty">
          ⚠️ تعذر تحميل الأخبار
        </div>
      `;

    }

  }


  /*
   * TRANSFERS
   *
   * في البداية نقرأ:
   * /data/transfers.json
   *
   * إذا لم يوجد الملف
   * لا نكسر الموقع.
   */

  async function loadTransfers() {

    const container =
      document.getElementById(
        "transfersContainer"
      );

    if (!container) return;


    try {

      const response =
        await fetch(
          "/data/transfers.json",
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      let transfers = [];


      if (Array.isArray(data)) {

        transfers = data;

      } else if (
        Array.isArray(data.transfers)
      ) {

        transfers =
          data.transfers;

      }


      if (!transfers.length) {

        container.innerHTML = `
          <div class="tj-empty">
            🔄 لا توجد انتقالات حاليًا
          </div>
        `;

        return;

      }


      container.innerHTML =
        transfers
          .slice(0, 20)
          .map(function (transfer) {

            const player =
              transfer.player ||
              transfer.name ||
              "لاعب";


            const from =
              transfer.from ||
              transfer.fromTeam ||
              "غير معروف";


            const to =
              transfer.to ||
              transfer.toTeam ||
              "غير معروف";


            return `

              <div class="tj-transfer-card">

                <div>

                  <div
                    class="tj-transfer-player"
                  >
                    ${safe(player)}
                  </div>

                  <div
                    class="tj-transfer-team"
                  >
                    ${safe(from)}
                  </div>

                </div>


                <div
                  class="tj-transfer-arrow"
                >
                  →
                </div>


                <div>

                  <div
                    class="tj-transfer-player"
                  >
                    ${safe(to)}
                  </div>

                  <div
                    class="tj-transfer-team"
                  >
                    انتقال
                  </div>

                </div>

              </div>

            `;

          })
          .join("");


    } catch (error) {

      console.warn(
        "Transfers file not available:",
        error
      );


      container.innerHTML = `
        <div class="tj-empty">
          🔄 لا توجد بيانات انتقالات حاليًا
        </div>
      `;

    }

  }


  /*
   * START
   */

  loadNews();
  loadTransfers();


})();

</script>
