<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TJ Football ⚽</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

header {
    background: linear-gradient(135deg, #e50914, #071a52);
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
}

nav {
    background: white;
    padding: 12px;
    text-align: center;
}

button {
    border: 0;
    padding: 10px 18px;
    margin: 4px;
    border-radius: 20px;
    font-weight: bold;
}

.active {
    background: #e50914;
    color: white;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.loading {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 12px;
}

.league {
    background: white;
    margin-top: 15px;
    border-radius: 12px;
    overflow: hidden;
}

.league-title {
    background: #071a52;
    color: white;
    padding: 12px;
    font-weight: bold;
}

.match {
    padding: 18px 10px;
    border-bottom: 1px solid #eee;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 70px 1fr;
    align-items: center;
    text-align: center;
}

.team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-weight: bold;
}

.team img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.score {
    font-size: 22px;
    font-weight: bold;
}

.status {
    text-align: center;
    margin-top: 8px;
    color: #e50914;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<h1>⚽ TJ Football</h1>

<p>Live Football Scores</p>

</header>

<nav>

<button id="live" class="active">
🔴 LIVE
</button>

<button id="all">
⚽ ALL
</button>

</nav>

<main>

<div id="app">

<div class="loading">
⏳ جاري تحميل المباريات...
</div>

</div>

</main>

<script>

var data = [];

var app = document.getElementById("app");

var liveButton = document.getElementById("live");

var allButton = document.getElementById("all");

var currentMode = "live";


async function loadData() {

    try {

        var response = await fetch("/api/football");

        var json = await response.json();

        data = json.response || [];

        render();

    } catch (error) {

        app.innerHTML =
        "<div class='loading'>❌ حدث خطأ في الاتصال بالـ API</div>";

        console.log(error);

    }

}


async function render() {

    app.innerHTML = "";

    var list = [];

    var i;

    for (i = 0; i < data.length; i++) {

        var match = data[i];

        var status = match.fixture.status.short;

        if (currentMode === "all") {

            list.push(match);

        } else {

            if (
                status === "1H" ||
                status === "2H" ||
                status === "HT" ||
                status === "ET" ||
                status === "P" ||
                status === "LIVE"
            ) {

                list.push(match);

            }

        }

    }


    if (list.length === 0) {

        app.innerHTML =
        "<div class='loading'>لا توجد مباريات حاليًا</div>";

        return;

    }


    var leagues = {};


    for (i = 0; i < list.length; i++) {

        var league =
        list[i].league.name;

        if (!leagues[league]) {

            leagues[league] = [];

        }

        leagues[league].push(list[i]);

    }


    for (var leagueName in leagues) {

        var box =
        document.createElement("div");

        box.className = "league";


        var title =
        document.createElement("div");

        title.className = "league-title";

        title.textContent =
        "🏆 " +
        leagueName;


        box.appendChild(title);


        for (
            var j = 0;
            j < leagues[leagueName].length;
            j++
        ) {

            var m =
            leagues[leagueName][j];


            var match =
            document.createElement("div");

            match.className = "match";


            var home =
            m.teams.home.name;

            var away =
            m.teams.away.name;


            var homeLogo =
            m.teams.home.logo;

            var awayLogo =
            m.teams.away.logo;


            var homeScore =
            m.goals.home;

            var awayScore =
            m.goals.away;


            if (homeScore === null) {

                homeScore = 0;

            }


            if (awayScore === null) {

                awayScore = 0;

            }


            var status =
            m.fixture.status.short;


            var statusText =
            status;


            if (
                status === "1H" ||
                status === "2H" ||
                status === "HT" ||
                status === "ET" ||
                status === "P" ||
                status === "LIVE"
            ) {

                statusText = "🔴 LIVE";

                if (m.fixture.status.elapsed) {

                    statusText =
                    "🔴 LIVE " +
                    m.fixture.status.elapsed +
                    "'";

                }

            }


            match.innerHTML =

            "<div class='teams'>" +

                "<div class='team'>" +

                    "<img src='" +
                    homeLogo +
                    "'>" +

                    "<span>" +
                    home +
                    "</span>" +

                "</div>" +


                "<div class='score'>" +

                    homeScore +
                    " : " +
                    awayScore +

                "</div>" +


                "<div class='team'>" +

                    "<img src='" +
                    awayLogo +
                    "'>" +

                    "<span>" +
                    away +
                    "</span>" +

                "</div>" +

            "</div>" +


            "<div class='status'>" +
            statusText +
            "</div>";


            box.appendChild(match);

        }


        app.appendChild(box);

    }

}


liveButton.onclick = function() {

    currentMode = "live";

    liveButton.className = "active";

    allButton.className = "";

    render();

};


allButton.onclick = function() {

    currentMode = "all";

    allButton.className = "active";

    liveButton.className = "";

    render();

};


loadData();


setInterval(function() {

    loadData();

}, 60000);

</script>

</body>

</html>
