<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TJ Football ⚽</title>

<style>

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f5f9;
    color:#111827;
}

header{
    background:linear-gradient(135deg,#071a52,#0b3ca8,#d90416);
    color:white;
    padding:20px;
    text-align:center;
}

h1{
    margin:0;
    font-size:32px;
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

#status{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 3px 15px #0001;
}

.matches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.match{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 4px 15px #0001;
}

.top{
    display:flex;
    justify-content:space-between;
    color:#777;
    font-size:12px;
    margin-bottom:20px;
}

.teams{
    display:grid;
    grid-template-columns:1fr 70px 1fr;
    align-items:center;
    text-align:center;
}

.team{
    font-weight:bold;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
}

.score{
    font-size:25px;
    font-weight:900;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.finished{
    color:#059669;
}

.live{
    color:#dc2626;
}

.scheduled{
    color:#2563eb;
}

.error{
    color:#dc2626;
}

</style>
</head>


<body>

<header>

<h1>⚽ TJ Football</h1>

</header>


<main>

<div id="status">
⏳ جاري تحميل المباريات...
</div>


<div id="matches" class="matches"></div>

</main>


<script>

fetch("./data/matches.json")

.then(function(response){

    if(!response.ok){

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(function(data){

    console.log("DATA:",data);

    /*
    البنية التي أكدنا أنها موجودة عندك:
    
    {
        "filters": {...},
        "matches": [...]
    }
    */

    if(!data.matches){

        throw new Error(
            "لم يتم العثور على matches داخل JSON"
        );

    }


    var matches = data.matches;


    document.getElementById("status").innerHTML =
        "✅ تم تحميل " + matches.length + " مباريات";


    var container =
        document.getElementById("matches");


    container.innerHTML = "";


    matches.forEach(function(match){

        var home =
            match.homeTeam || {};

        var away =
            match.awayTeam || {};


        var homeName =
            home.name || "Home";

        var awayName =
            away.name || "Away";


        var homeLogo =
            home.logo || "";

        var awayLogo =
            away.logo || "";


        var homeScore =
            match.homeScore === null ||
            match.homeScore === undefined
            ? "-"
            : match.homeScore;


        var awayScore =
            match.awayScore === null ||
            match.awayScore === undefined
            ? "-"
            : match.awayScore;


        var statusText =
            "🕐 قادمة";

        var statusClass =
            "scheduled";


        if(match.status === "finished"){

            statusText =
                "✅ انتهت";

            statusClass =
                "finished";

        }


        if(match.status === "live"){

            statusText =
                "🔴 مباشر";

            statusClass =
                "live";

        }


        var card =
            document.createElement("div");


        card.className =
            "match";


        card.innerHTML =

        '<div class="top">' +

            '<span>' +
            (match.league || "Football") +
            '</span>' +

            '<span>' +
            (match.date || "") +
            '</span>' +

        '</div>' +


        '<div class="teams">' +


            '<div class="team">' +

                (
                    homeLogo

                    ?

                    '<img class="logo" src="' +
                    homeLogo +
                    '" onerror="this.style.display=\'none\'">' 

                    :

                    ''
                ) +

                '<div>' +
                homeName +
                '</div>' +

            '</div>' +


            '<div class="score">' +

                homeScore +
                ' - ' +
                awayScore +

            '</div>' +


            '<div class="team">' +

                (
                    awayLogo

                    ?

                    '<img class="logo" src="' +
                    awayLogo +
                    '" onerror="this.style.display=\'none\'">' 

                    :

                    ''
                ) +

                '<div>' +
                awayName +
                '</div>' +

            '</div>' +


        '</div>' +


        '<div class="status ' +
        statusClass +
        '">' +

        statusText +

        '</div>';


        container.appendChild(card);

    });

})


.catch(function(error){

    console.error(error);


    document.getElementById("status").innerHTML =

        '<span class="error">' +

        '❌ حدث خطأ أثناء تحميل المباريات' +

        '<br><br>' +

        error.message +

        '</span>';

});

</script>


</body>

</html>
