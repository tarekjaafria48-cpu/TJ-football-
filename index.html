<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TJ Football ⚽</title>

  <meta
    name="description"
    content="TJ Football - مباريات ونتائج كرة القدم مباشرة"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(
          circle at top right,
          #152c4d 0%,
          #071321 45%,
          #03070d 100%
        );
      color: #fff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(3, 9, 18, .96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 15px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #ff1744,
        #e60046,
        #245cff
      );
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 25px rgba(255,23,68,.25);
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand-text p {
      color: #9ba9bd;
      font-size: 12px;
      margin-top: 3px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #ff3158;
      font-weight: bold;
      font-size: 13px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff1744;
      box-shadow: 0 0 12px rgba(255,23,68,.8);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto 0;
      padding: 20px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 35px 25px;
      background:
        linear-gradient(
          135deg,
          rgba(21,45,76,.95),
          rgba(8,18,32,.98)
        );
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255,23,68,.14);
      filter: blur(45px);
      left: -70px;
      top: -80px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: clamp(35px,8vw,65px);
      font-weight: 900;
      background:
        linear-gradient(
          90deg,
          #ff416c,
          #ff9a9e,
          #61a5ff
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }

    .hero-subtitle {
      color: #d9e0ea;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .hero-description {
      color: #8fa1b8;
      font-size: 15px;
      line-height: 1.8;
    }

    .controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      border: none;
      cursor: pointer;
      padding: 12px 22px;
      border-radius: 30px;
      background: #101d2d;
      color: #b9c5d5;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.08);
      transition: .2s;
    }

    .filter-btn.active {
      background: linear-gradient(
        135deg,
        #ff1744,
        #e60046
      );
      color: white;
      box-shadow: 0 8px 25px rgba(255,23,68,.25);
    }

    .refresh-btn {
      border: 1px solid rgba(255,255,255,.1);
      background: #101d2d;
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .status {
      max-width: 1100px;
      margin: 0 auto 18px;
      padding: 0 20px;
    }

    .status-box {
      display: none;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(16,29,45,.9);
      border: 1px solid rgba(255,255,255,.08);
      color: #aebbd0;
      text-align: center;
    }

    .status-box.show {
      display: block;
    }

    .status-box.error {
      color: #ff7c96;
    }

    .main {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 900;
    }

    .section-label {
      color: #ff3158;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .count {
      color: #7f91a8;
      font-size: 13px;
    }

    .matches {
      display: grid;
      gap: 14px;
    }

    .league {
      overflow: hidden;
      border-radius: 20px;
      background: rgba(7,18,32,.95);
      border: 1px solid rgba(255,255,255,.08);
    }

    .league-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255,255,255,.025);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .league-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
    }

    .league-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .country {
      color: #71839b;
      font-size: 12px;
      margin-top: 3px;
    }

    .match-card {
      display: grid;
      grid-template-columns: 1fr 105px 1fr;
      align-items: center;
      min-height: 120px;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .match-card:last-child {
      border-bottom: none;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .team.home {
      justify-content: flex-start;
    }

    .team.away {
      justify-content: flex-end;
      text-align: left;
    }

    .team-info {
      min-width: 0;
    }

    .team-name {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.4;
    }

    .team-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .score-area {
      text-align: center;
    }

    .time {
      color: #9aa8bb;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .score {
      font-size: 25px;
      font-weight: 900;
    }

    .status-live,
    .status-finished,
    .status-upcoming {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
    }

    .status-live {
      padding: 4px 9px;
      border-radius: 20px;
      background: rgba(255,23,68,.14);
      color: #ff3158;
    }

    .status-finished {
      color: #62d68b;
    }

    .status-upcoming {
      color: #61a5ff;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;
      background: rgba(7,18,32,.9);
      border: 1px solid rgba(255,255,255,.08);
      color: #8d9db2;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .footer {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px 40px;
      text-align: center;
      color: #62748a;
      font-size: 12px;
    }

    @media (max-width:650px) {

      .header-inner {
        gap: 10px;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .live-indicator {
        font-size: 11px;
      }

      .hero {
        padding: 15px;
      }

      .hero-card {
        padding: 28px 20px;
        border-radius: 22px;
      }

      .hero-subtitle {
        font-size: 18px;
      }

      .controls {
        padding: 0 15px 15px;
      }

      .filter-group {
        width: 100%;
      }

      .filter-btn {
        flex: 1;
      }

      .refresh-btn {
        width: 100%;
      }

      .main {
        padding: 0 15px 40px;
      }

      .match-card {
        grid-template-columns: 1fr 70px 1fr;
        padding: 14px 8px;
        min-height: 105px;
      }

      .team-logo {
        width: 36px;
        height: 36px;
      }

      .team-name {
        font-size: 12px;
      }

      .score {
        font-size: 21px;
      }

      .league-header {
        padding: 12px;
      }

      .section-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="brand">
      <div class="logo">⚽</div>

      <div class="brand-text">
        <h1>TJ FOOTBALL</h1>
        <p>نبض كرة القدم</p>
      </div>
    </div>

    <div class="live-indicator">
      <span class="live-dot"></span>
      LIVE
    </div>

  </div>
</header>


<section class="hero">

  <div class="hero-card">

    <div class="hero-content">

      <div class="hero-title">
        TJ FOOTBALL
      </div>

      <div class="hero-subtitle">
        كرة القدم... بأسلوب آخر ⚽
      </div>

      <div class="hero-description">
        تابع المباريات والنتائج المباشرة
        في تجربة واحدة سريعة وبسيطة.
      </div>

    </div>

  </div>

</section>


<div class="controls">

  <div class="filter-group">

    <button
      id="allButton"
      class="filter-btn active"
      type="button"
    >
      ALL ⚽
    </button>

    <button
      id="liveButton"
      class="filter-btn"
      type="button"
    >
      LIVE 🔴
    </button>

  </div>

  <button
    id="refreshButton"
    class="refresh-btn"
    type="button"
  >
    🔄 تحديث
  </button>

</div>


<div class="status">

  <div
    id="statusBox"
    class="status-box"
  ></div>

</div>


<main class="main">

  <section class="section">

    <div class="section-header">

      <div>

        <div class="section-label">
          FOOTBALL
        </div>

        <div class="section-title">
          ⚽ المباريات
        </div>

      </div>

      <div
        id="matchCount"
        class="count"
      >
        0 مباراة
      </div>

    </div>


    <div
      id="matchesContainer"
      class="matches"
    >

      <div class="empty">

        <div class="empty-icon">
          ⚽
        </div>

        <div>
          جاري تحميل المباريات...
        </div>

      </div>

    </div>

  </section>

</main>


<footer class="footer">
  TJ Football ⚽
  <br>
  Live Football Scores
</footer>


<script>

  /*
   * TJ FOOTBALL
   * ============================
   * هذا الكود يتعامل مع:
   *
   * {
   *   response: [...]
   * }
   *
   * وأيضاً:
   *
   * [...]
   *
   * وأيضاً:
   *
   * {
   *   matches: [...]
   * }
   */

  const API_URL = "/api/football";

  let allMatches = [];
  let currentMode = "all";


  const matchesContainer =
    document.getElementById("matchesContainer");

  const matchCount =
    document.getElementById("matchCount");

  const statusBox =
    document.getElementById("statusBox");

  const allButton =
    document.getElementById("allButton");

  const liveButton =
    document.getElementById("liveButton");

  const refreshButton =
    document.getElementById("refreshButton");


  /*
   * حماية النص
   */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * رسالة الحالة
   */

  function showStatus(message, error = false) {

    statusBox.textContent = message;

    statusBox.classList.add("show");

    if (error) {
      statusBox.classList.add("error");
    } else {
      statusBox.classList.remove("error");
    }

  }


  function hideStatus() {

    statusBox.textContent = "";

    statusBox.classList.remove("show");
    statusBox.classList.remove("error");

  }


  /*
   * الوقت
   */

  function formatTime(dateString) {

    if (!dateString) {
      return "--:--";
    }

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
      return "--:--";
    }

    try {

      return new Intl.DateTimeFormat(
        "ar-TN",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Africa/Tunis"
        }
      ).format(date);

    } catch (error) {

      return date.toLocaleTimeString(
        "fr-TN",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }

  }


  /*
   * حالة المباراة
   */

  function getMatchStatus(match) {

    const fixture =
      match && match.fixture
        ? match.fixture
        : {};

    const status =
      fixture.status || {};

    const short =
      String(status.short || "").toUpperCase();

    const long =
      String(status.long || "").toLowerCase();

    const elapsed =
      status.elapsed;


    const liveStatuses = [
      "1H",
      "2H",
      "ET",
      "BT",
      "P",
      "LIVE"
    ];


    const finishedStatuses = [
      "FT",
      "AET",
      "PEN"
    ];


    if (
      liveStatuses.includes(short) ||
      long.includes("live") ||
      long.includes("first half") ||
      long.includes("second half") ||
      long.includes("extra time")
    ) {

      return {
        type: "live",
        text:
          elapsed !== null &&
          elapsed !== undefined
            ? "مباشر " + elapsed + "'"
            : "مباشر"
      };

    }


    if (
      finishedStatuses.includes(short) ||
      long.includes("finished")
    ) {

      return {
        type: "finished",
        text: "انتهت"
      };

    }


    return {
      type: "upcoming",
      text: formatTime(
        fixture.date
      )
    };

  }


  /*
   * الأهداف
   */

  function getScore(match) {

    const goals =
      match && match.goals
        ? match.goals
        : {};

    return {

      home:
        goals.home !== null &&
        goals.home !== undefined
          ? goals.home
          : 0,

      away:
        goals.away !== null &&
        goals.away !== undefined
          ? goals.away
          : 0

    };

  }


  /*
   * شعار الفريق
   */

  function getTeamLogo(team) {

    if (
      team &&
      typeof team.logo === "string" &&
      team.logo.trim() !== ""
    ) {

      return team.logo;

    }

    return "";

  }


  /*
   * الفريق
   */

  function createTeam(team, side) {

    team = team || {};

    const name =
      team.name ||
      "غير معروف";


    const logo =
      getTeamLogo(team);


    let imageHTML = "";


    if (logo) {

      imageHTML = `
        <img
          class="team-logo"
          src="${escapeHTML(logo)}"
          alt=""
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `;

    } else {

      imageHTML = `
        <div
          class="team-logo"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
          "
        >
          ⚽
        </div>
      `;

    }


    return `
      <div class="team ${side}">

        ${
          side === "home"
            ? imageHTML
            : ""
        }

        <div class="team-info">

          <div class="team-name">
            ${escapeHTML(name)}
          </div>

        </div>

        ${
          side === "away"
            ? imageHTML
            : ""
        }

      </div>
    `;

  }


  /*
   * بطاقة المباراة
   */

  function createMatchCard(match) {

    match = match || {};

    const teams =
      match.teams || {};

    const home =
      teams.home || {};

    const away =
      teams.away || {};

    const fixture =
      match.fixture || {};

    const score =
      getScore(match);

    const status =
      getMatchStatus(match);


    let statusHTML = "";


    if (status.type === "live") {

      statusHTML = `
        <span class="status-live">
          ${escapeHTML(status.text)}
        </span>
      `;

    }

    else if (status.type === "finished") {

      statusHTML = `
        <span class="status-finished">
          انتهت
        </span>
      `;

    }

    else {

      statusHTML = `
        <span class="status-upcoming">
          ${escapeHTML(status.text)}
        </span>
      `;

    }


    return `
      <div class="match-card">

        ${createTeam(home, "home")}

        <div class="score-area">

          <div class="time">
            ${formatTime(fixture.date)}
          </div>

          <div class="score">
            ${escapeHTML(score.home)}
            -
            ${escapeHTML(score.away)}
          </div>

          <div>
            ${statusHTML}
          </div>

        </div>

        ${createTeam(away, "away")}

      </div>
    `;

  }


  /*
   * ترتيب المباريات حسب التاريخ
   */

  function sortMatches(list) {

    return [...list].sort(
      function(a, b) {

        const dateA =
          new Date(
            a &&
            a.fixture &&
            a.fixture.date
              ? a.fixture.date
              : 0
          ).getTime();

        const dateB =
          new Date(
            b &&
            b.fixture &&
            b.fixture.date
              ? b.fixture.date
              : 0
          ).getTime();

        return dateA - dateB;

      }
    );

  }


  /*
   * تجميع حسب البطولة
   */

  function groupByLeague(list) {

    const groups = {};

    list.forEach(
      function(match) {

        const league =
          match &&
          match.league
            ? match.league
            : {};

        const id =
          league.id ||
          "unknown";


        if (!groups[id]) {

          groups[id] = {

            league: league,

            matches: []

          };

        }


        groups[id].matches.push(match);

      }
    );


    return Object.values(groups);

  }


  /*
   * إنشاء بطولة
   */

  function createLeague(group) {

    const league =
      group.league || {};


    const name =
      league.name ||
      "بطولة غير معروفة";


    const country =
      league.country ||
      "";


    const logo =
      league.logo ||
      "";


    const logoHTML =
      logo

        ? `
          <img
            class="league-logo"
            src="${escapeHTML(logo)}"
            alt=""
            loading="lazy"
            onerror="this.style.display='none'"
          >
        `

        : `
          <span style="font-size:25px">
            🏆
          </span>
        `;


    return `
      <div class="league">

        <div class="league-header">

          <div class="league-name">

            ${logoHTML}

            <div>

              <div>
                ${escapeHTML(name)}
              </div>

              ${
                country
                  ? `
                    <div class="country">
                      ${escapeHTML(country)}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>

          <div class="count">
            ${group.matches.length}
          </div>

        </div>

        ${group.matches
          .map(createMatchCard)
          .join("")}

      </div>
    `;

  }


  /*
   * عرض المباريات
   */

  function displayMatches(list) {

    const safeList =
