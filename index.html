<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TJ Football ⚽</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
    }

    header {
      background: linear-gradient(135deg, #06184b, #0b328f, #e30613);
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px 12px;
    }

    #status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .matches {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );
      gap: 15px;
    }

    .match {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .league {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      text-align: center;
      gap: 5px;
    }

    .team {
      font-weight: bold;
      font-size: 14px;
    }

    .team img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
    }

    .live {
      color: red;
      font-weight: bold;
    }

    .finished {
      color: green;
    }

    .scheduled {
      color: #2563eb;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ TJ Football</h1>
  <p>Football • Matches • Results</p>
</header>

<div class="container">

  <div id="status">
    ⏳ جاري تحميل المباريات...
  </div>

  <div
    id="matches"
    class="matches">
  </div>

</div>

<script>

async function loadMatches() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("matches");

  try {

    const response = await fetch(
      "./data/matches.json?v=" +
      Date.now()
    );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    console.log(
      "TJ Football DATA:",
      data
    );

    const matches =
      data.matches;

    if (!Array.isArray(matches)) {

      throw new Error(
        "لم يتم العثور على matches"
      );

    }

    status.innerHTML =
      "✅ تم تحميل " +
      matches.length +
      " مباريات";

    container.innerHTML =
      matches.map(match => {

        const home =
          match.homeTeam || {};

        const away =
          match.awayTeam || {};

        let statusText =
          "🕐 قادمة";

        if (
          match.status === "live"
        ) {
          statusText =
            "🔴 مباشر";
        }

        if (
          match.status === "finished"
        ) {
          statusText =
            "✅ انتهت";
        }

        return `

          <div class="match">

            <div class="league">
              ${match.league || ""}
            </div>

            <div class="teams">

              <div class="team">

                <img
                  src="${home.logo || ""}"
                  alt=""
                  onerror="
                    this.style.display='none'
                  "
                >

                ${home.name || "Home"}

              </div>

              <div class="score">

                ${match.homeScore ?? "-"}
                -
                ${match.awayScore ?? "-"}

              </div>

              <div class="team">

                <img
                  src="${away.logo || ""}"
                  alt=""
                  onerror="
                    this.style.display='none'
                  "
                >

                ${away.name || "Away"}

              </div>

            </div>

            <div
              class="status ${match.status || ""}">
              ${statusText}
            </div>

            <div
              style="
                text-align:center;
                margin-top:8px;
                color:#777;
                font-size:11px;
              ">
              ${match.date || ""}
            </div>

          </div>

        `;

      }).join("");

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ خطأ: " +
      error.message;

    container.innerHTML = "";

  }

}

loadMatches();

</script>

</body>
</html>
